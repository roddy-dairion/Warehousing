# Codemagic CI for the warehouse mobile app (frontend/projects/mobile, Ionic + Capacitor).
# Setup and first build: docs/11-mobile-builds-codemagic.md
#
# Workflows (all start manually from Codemagic: "Start new build" -> choose the workflow):
#   android-test        Debug APK to install directly on Android phones/scanners. Free, no store account.
#   ios-test-unsigned   Unsigned .ipa for a test iPhone, installed with a free Apple ID (e.g. Sideloadly). Free.
#   android-release     Signed .aab for Google Play (needs the upload keystore; publishing optional).
#   ios-release         Signed .ipa sent to TestFlight (needs the paid Apple Developer account).
#
# Environment variable groups to create in Codemagic (Team/App settings -> Environment variables):
#   mobile_test     API_BASE_URL  e.g. http://192.168.1.20:5080/api/v1  (the office PC running the API, same Wi-Fi as the phone)
#   mobile_release  API_BASE_URL  e.g. https://warehouse-api.hellocherie.ch/api/v1  (HTTPS required)
#   google_play     GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS  (only when publishing to Google Play is switched on)

definitions:
  environment: &base_environment
    node: 22
    java: 21
    xcode: latest
    cocoapods: default
    vars:
      APP_VERSION: 1.0.0          # shown to users; raise it for each release (the build number is automatic)
  cache: &cache
    cache_paths:
      - $HOME/.npm
      - $HOME/.gradle/caches
  scripts:
    - &install
      name: Install dependencies
      script: npm ci
    - &unit_tests
      name: Unit tests (shared, web, mobile)
      script: npm test
    - &android_sdk
      name: Point Gradle at the Android SDK
      script: echo "sdk.dir=$ANDROID_SDK_ROOT" > projects/mobile/android/local.properties

workflows:
  android-test:
    name: Android test APK (debug)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: frontend
    environment:
      <<: *base_environment
      groups:
        - mobile_test
      vars:
        APP_VERSION: 1.0.0
        CAP_DEV: "1"              # allows plain HTTP to the API on the local network (debug/test only)
    cache: *cache
    scripts:
      - *install
      - *unit_tests
      - name: Set the API address
        script: node scripts/mobile-ci.mjs env
      - name: Build the app and copy it into the Android project
        script: |
          npx ng build mobile --configuration production
          npx cap sync android
      - *android_sdk
      - name: Build the debug APK
        script: |
          cd projects/mobile/android
          ./gradlew assembleDebug -PversionCode=$BUILD_NUMBER -PversionName=$APP_VERSION
    artifacts:
      - frontend/projects/mobile/android/app/build/outputs/apk/debug/*.apk

  ios-test-unsigned:
    name: iOS test build (unsigned, for free sideloading)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    environment:
      <<: *base_environment
      groups:
        - mobile_test
      vars:
        APP_VERSION: 1.0.0
        CAP_DEV: "1"
    cache: *cache
    scripts:
      - *install
      - *unit_tests
      - name: Set the API address and version
        script: |
          node scripts/mobile-ci.mjs env
          node scripts/mobile-ci.mjs ios-version
      - name: Build the app and copy it into the iOS project (runs pod install)
        script: |
          npx ng build mobile --configuration production
          npx cap sync ios
      - name: Build an unsigned .ipa
        script: |
          cd projects/mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$CM_BUILD_DIR/build/App.xcarchive/Products/Applications/App.app" "$CM_BUILD_DIR/build/ipa/Payload/"
          cd "$CM_BUILD_DIR/build/ipa" && zip -qr "HelloCherie-Warehouse-$APP_VERSION-$BUILD_NUMBER-unsigned.ipa" Payload
    artifacts:
      - build/ipa/*.ipa

  android-release:
    name: Android release (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    environment:
      <<: *base_environment
      android_signing:
        - hellocherie_upload      # keystore uploaded in Codemagic under this reference name
      groups:
        - mobile_release
        # - google_play           # uncomment with the publishing section below
    cache: *cache
    scripts:
      - *install
      - *unit_tests
      - name: Set the API address (HTTPS)
        script: node scripts/mobile-ci.mjs env
      - name: Build the app and copy it into the Android project
        script: |
          npx ng build mobile --configuration production
          npx cap sync android
      - *android_sdk
      - name: Build the signed app bundle
        script: |
          cd projects/mobile/android
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER -PversionName=$APP_VERSION
    artifacts:
      - frontend/projects/mobile/android/app/build/outputs/bundle/release/*.aab
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: frontend
    integrations:
      app_store_connect: HelloCherie App Store Connect   # API key name created in Codemagic (needs the paid Apple account)
    environment:
      <<: *base_environment
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.hellocherie.warehouse
      groups:
        - mobile_release
    cache: *cache
    scripts:
      - *install
      - *unit_tests
      - name: Set the API address (HTTPS) and version
        script: |
          node scripts/mobile-ci.mjs env
          node scripts/mobile-ci.mjs ios-version
      - name: Build the app and copy it into the iOS project (runs pod install)
        script: |
          npx ng build mobile --configuration production
          npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles --project projects/mobile/ios/App/App.xcodeproj
      - name: Build the signed .ipa
        script: |
          cd projects/mobile/ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - frontend/projects/mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
